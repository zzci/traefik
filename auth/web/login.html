<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f6; display: flex;
         align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  form { background: #fff; padding: 2rem; border-radius: 8px; width: 20rem;
         box-shadow: 0 1px 4px rgba(0,0,0,.1); display: flex; flex-direction: column; gap: .75rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  input { padding: .6rem .7rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
  button { padding: .6rem; border: 0; border-radius: 6px; background: #111827;
           color: #fff; font-size: 1rem; cursor: pointer; }
  .error { color: #b91c1c; margin: 0; font-size: .9rem; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Sign in</h1>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="rd" value="{{.RD}}">
  <input name="username" placeholder="Username" autocomplete="username" required autofocus>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
  <button>Sign in</button>
</form>
</body>
</html>
