name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: zzci/traefik
  RELEASE_FILES: aa docker-compose.yml env.example

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: push
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release assets
        run: |
          mkdir -p traefik/data/ssl traefik/data/logs traefik/services traefik/example
          cp ${{ env.RELEASE_FILES }} traefik/
          cp traefik.yml traefik/data/
          cp example/* traefik/example/
          touch traefik/data/ssl/.gitkeep traefik/data/logs/.gitkeep traefik/services/.gitkeep
          tar czf traefik-${{ github.ref_name }}.tar.gz traefik/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: traefik-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
