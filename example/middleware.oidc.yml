# OpenID Connect authentication
http:
  middlewares:
    oidc:
      plugin:
        oidc-plugin:
          # Cookie encryption secret (32 chars), generate with: openssl rand -hex 16
          Secret: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
          SessionCookie:
            Domain: '.demo.io'
          CallbackUri: https://auth.demo.io/traefik/callback
          Provider:
            Url: https://login.demo.io/oidc
            ClientId: id
            UsePkce: true
          Scopes:
            - openid
            - profile
            - email
            - roles
          Authorization:
            AssertClaims:
              - Name: roles
                AnyOf:
                  - traefik-station-self
