services:
  traefik:
    container_name: traefik
    hostname: traefik
    image: zzci/traefik
    restart: always
    ports:
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443/tcp
    networks:
      - traefik
    volumes:
      - ./data:/data
      - ./services:/services
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      LEGO_DISABLE_CNAME_SUPPORT: ${ACME_DISABLE_CNAME:-true}
      HTTPREQ_ENDPOINT: https://api.dnsall.com
      HTTPREQ_USERNAME: xxx
      HTTPREQ_PASSWORD: xxx
      ## Built-in ForwardAuth login service (see auth/), disabled by default.
      ## Uncomment to enable; secret is a bcrypt hash ($ escaped as $$,
      ## generate with: docker exec -it traefik auth hash) or a plaintext
      ## password (no ":" or ","). Optional base config: ./data/auth.yml;
      ## AUTH_* vars override fields from the file.
      # ZSRV_auth: "true"
      # AUTH_DOMAIN: example.com
      # AUTH_COOKIE_NAME: _auth
      # AUTH_USERS: "admin:$$2a$$12$$replace_me:admin"
      # AUTH_SECRET: "random_32+_chars"   # optional; unset = auto-generated in /data/auth

networks:
  traefik:
    external: true
